name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------- Linux: installation via apt ----------
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsodium-dev \
          libsqlite3-dev \
          libboost-all-dev \
          libgtest-dev

    # ---------- Windows: installation vcpkg ----------
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install libsodium sqlite3 boost-asio gtest

    # ---------- Qt6 (for both OS) ----------
    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        cache: true

    # ---------- CMake configuration ----------
    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    # ---------- build ----------
    - name: Build
      run: cmake --build build --config Release --parallel

    # ---------- tests ----------
    - name: Run tests
      run: ctest --test-dir build --output-on-failure -C Release
